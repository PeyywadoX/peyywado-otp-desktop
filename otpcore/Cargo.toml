[package]
name = "otpcore"
version = "1.0.0"
edition = "2021"

[lib]
name = "otpcore"
path = "src/lib.rs"

[dependencies]
hmac = "0.12.1"
sha1 = "0.10.6"
sha2 = "0.10.8"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["block-padding", "alloc"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
rand = "0.8.5"
chrono = "0.4.38"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
flate2 = "1.0.35"
